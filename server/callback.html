<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Signing in - Pestis</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f6f8; --card: #fff; --text: #111827; --muted: #6b7280; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #e5e7eb; --muted: #94a3b8; --accent: #2dd4bf; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .card { background: var(--card); padding: 28px 30px; border-radius: 14px; box-shadow: 0 6px 30px rgba(0,0,0,.08); max-width: 420px; margin: 16px; text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid rgba(127,127,127,.25); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 6px 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="card" id="box"><div class="spin"></div><h1>Signing you in...</h1><p>One moment.</p></div>
<script>
(async function () {
  const box = document.getElementById('box');
  const KEY = 'sb-' + location.origin.replace(/^https?:\/\//, '').split('.')[0] + '-auth-token';   // the apps' shared sign-in
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const sameSite = to => { try { const u = new URL(to || '/', location.origin); return u.origin === location.origin ? u.pathname + u.search : '/'; } catch (e) { return '/'; } };
  let back = '/';
  const fail = msg => {
    box.innerHTML = `<h1>Sign-in didn't work</h1><p>${esc(msg)}</p><p><a href="${esc(back)}">Back to Pestis</a></p>`;
  };
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const query = new URLSearchParams(location.search);
  history.replaceState(null, '', location.pathname);   // keep the token out of the history
  try {
    let r;
    if (query.get('link')) {
      r = await fetch('/api/auth/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: query.get('link') }) });
    } else {
      let started = {};
      try { started = JSON.parse(sessionStorage.getItem('pestis-google-signin') || '{}'); } catch (e) {}
      sessionStorage.removeItem('pestis-google-signin');
      back = sameSite(started.redirectTo);
      if (hash.get('error')) return fail(hash.get('error') === 'access_denied' ? 'Sign-in was cancelled.' : 'Google said: ' + (hash.get('error_description') || hash.get('error')));
      if (!hash.get('id_token')) return fail('Google did not send a sign-in. Try again.');
      if (!started.state || started.state !== hash.get('state')) return fail('This sign-in was started in another window or has expired. Try again.');
      r = await fetch('/api/auth/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: hash.get('id_token'), nonce: started.nonce }) });
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.session) return fail(j.error || ('The server said ' + r.status));
    localStorage.setItem(KEY, JSON.stringify(j.session));
    try { localStorage.setItem('pestis-last-active', String(Date.now())); } catch (e) {}
    location.replace(j.redirectTo ? sameSite(j.redirectTo) : back);
  } catch (e) {
    fail("Couldn't reach the Pestis server. Check the internet connection and try again.");
  }
})();
</script>
</body>
</html>
