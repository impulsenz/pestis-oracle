<!--
    PESTIS SERVICE APP - ADMIN
    ==========================
    Everything only admins use, kept up to date separately from index.html:
      * the Admin page: overview, users and approvals, Client Portal logins, services, documents,
        the station form lists, team settings, activity and exports
      * technician profiles shown to clients
      * giving client logins access to a site

    This is the Admin site: open admin.html (e.g. https://<your site>/admin.html) and sign in with an admin account.
    It runs the app from index.html in "admin mode" with its own sign-in, then adds the Admin page below.
    The Service App (index.html) has no admin links or admin powers. Upload this file next to index.html.

    Add-on version: 2026.10.22-a4   (written for the app's add-on hook-up version 1, see ADDON_API in index.html)
-->

.pr-acts { display: flex; flex-wrap: wrap; gap: .4rem; margin-left: auto; }
.pr-btn, .pr-back { padding: .5rem .8rem; border-radius: .7rem; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-weight: 700; font-size: .75rem; cursor: pointer; white-space: nowrap; }

.pr-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .6rem; }
.pr-card { display: flex; gap: .75rem; align-items: flex-start; text-align: left; padding: .85rem; border-radius: .9rem; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; transition: border-color .15s, transform .15s; }

.pr-kpi { padding: .7rem .8rem; border-radius: .9rem; border: 1px solid var(--border); background: var(--surface2); }
.pr-kpi-v { font-size: 1.25rem; font-weight: 900; color: var(--text); line-height: 1.15; word-break: break-word; }
.pr-kpi-l { font-size: .68rem; color: var(--muted); margin-top: .15rem; }
.pr-chart { padding: .7rem; border-radius: .9rem; border: 1px solid var(--border); background: var(--surface); }
.pr-cap { font-size: .7rem; font-weight: 800; color: var(--muted); margin-bottom: .3rem; }
.pr-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: .7rem; }
.pr-svg { width: 100%; height: auto; display: block; }
.pr-svg .pr-grid { stroke: var(--border); stroke-width: 1; }
.pr-svg .pr-ax { font-size: 11px; fill: var(--muted); font-family: inherit; }

.pr-lim-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem; font-size: .8rem; color: var(--text); margin-bottom: .3rem; }

.pr-combo-q { width: 100%; font-size: .82rem; font-weight: 600; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: .55rem; padding: .45rem .6rem; margin-bottom: .3rem; outline: none; }

.pr-combo-list { max-height: 16rem; overflow-y: auto; display: flex; flex-direction: column; }

.pr-combo-none { font-size: .78rem; color: var(--faint); padding: .5rem; }
.pr-station { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
.pr-map-btn { flex-shrink: 0; }
@media print { .pr-combo-btn { background-image: none; padding-right: .65rem; } .pr-map-btn { display: none; } }

/* PESTIS-REPORTS-CSS:END */

<body style="font-family: system-ui, sans-serif; padding: 2rem; color: #334155; background: #f1f5f9;">
<p id="adminBoot" style="font-size: 14px;">Loading Pestis Admin...</p>
<script>
    // Starts the Admin site: loads the app (index.html) in admin mode in place of this page
    (function () {
        if (window.PESTIS_MODE) return;   // already running inside the app
        var fail = function (msg) { var el = document.getElementById('adminBoot'); if (el) el.innerHTML = 'Pestis Admin could not start: ' + msg + '. <a href="admin.html">Try again</a>'; };
        fetch('index.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('index.html could not be downloaded (' + r.status + ')'); return r.text(); }).then(function (html) {
            if (html.indexOf('ADMIN_MODE') < 0) throw new Error('index.html is out of date - upload the newest index.html');
            html = html.replace(/<head>/i, '<head><script>window.PESTIS_MODE = "admin";<\/script>');
            document.open(); document.write(html); document.close();
        }).catch(function (e) { fail(e && e.message || e); });
    })();
</script>

<!-- The add-on's page parts. index.html copies them into the app when it starts. -->

    const prepLink = (opts, name, bold) => { const id = name && opts.sdsOf ? opts.sdsOf(name) : null; const t = bold ? `<b>${e(name)}</b>` : e(name); return id ? `<button type="button" class="pr-link" data-id="${e(id)}" onclick="PR.sds(this, this.dataset.id)" title="Open the safety data sheet">${t} <span class="pr-sds">SDS ↗</span></button>` : t; };

    // ---------- small SVG charts ----------

    const table = (head, rows, opts) => `<div class="pr-tbl-wrap"><table class="pr-tbl"><thead><tr>${head.map(h => `<th class="${h.num ? 'num' : ''}">${e(h.t)}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr${r._cls ? ` class="${r._cls}"` : ''}>${r.cells.map((c, i) => `<td class="${head[i] && head[i].num ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${head.length}" class="pr-empty">${e((opts && opts.empty) || 'No records for this choice.')}</td></tr>`}</tbody></table></div>`;
    const kpis = list => `<div class="pr-kpis">${list.map(k => `<div class="pr-kpi"><div class="pr-kpi-v" ${k.c ? `style="color:${k.c}"` : ''}>${e(k.v)}</div><div class="pr-kpi-l">${e(k.l)}</div></div>`).join('')}</div>`;

    // ---------- state and drawing ----------
    const ST = new WeakMap();
    function render(box, data, opts) {
        opts = opts || {};
        let s = ST.get(box);
        if (!s) { s = { report: null, view: 'time', years: '2', preset: '12m', from: '', to: '', type: '', pest: '', station: '', map: '', prep: '', batch: '', tech: '', gap: '35', month: monthKey(Date.now()) }; ST.set(box, s); }
        box._pr = { data, opts };
        draw(box);
    }
    function set(btn, k, v) { const box = btn.closest('.pr-root').parentElement, s = ST.get(box); if (!s) return;
        if (k === 'report' && s._linked) { s.station = s._prevStation; s._linked = false; }   // back from a station opened by tapping its name: the other reports aren't left filtered to it
        if (k === 'station') s._linked = false;
        s[k] = v; if (k === 'report') window.scrollTo && box.scrollIntoView && box.scrollIntoView({ block: 'start', behavior: 'smooth' }); draw(box); }
    function draw(box) {
        const s = ST.get(box), { data, opts } = box._pr;
        if (!s.report) {
            box.innerHTML = `<div class="pr-root"><div class="pr-head"><div><h3 class="pr-h">Reports</h3><p class="pr-sub">Pick a report. Each one has just the filters it needs, and every report can be downloaded for Excel or printed / saved as a PDF.</p></div></div>
                <div class="pr-pick">${REPORTS.map(r => `<button type="button" class="pr-card" onclick="PR.set(this, 'report', '${r.id}')"><span class="pr-card-i">${r.icon}</span><span><b>${e(r.title)}</b><span>${e(r.blurb)}</span></span></button>`).join('')}</div></div>`;
            return;
        }
        const R = REPORTS.find(r => r.id === s.report);
        const out = BUILD[R.id](data, s, opts);
        box._pr.csv = out.csv;
        box.innerHTML = `<div class="pr-root pr-print">
            <div class="pr-head"><button type="button" class="pr-back" onclick="PR.set(this, 'report', null)">‹ All reports</button>
                <div class="min-w-0"><h3 class="pr-h">${R.icon} ${e(R.title)}</h3><p class="pr-sub">${e(data.site)}${R.f.includes('period') ? ' · ' + e(rangeText(s)) : ''}</p></div>
                <div class="pr-acts"><button type="button" class="pr-btn" onclick="PR.download(this)">⬇ Download (Excel)</button><button type="button" class="pr-btn" onclick="PR.print(this)">🖨 Print / PDF</button></div></div>
            <div class="pr-filters">${filtersHtml(R, data, s)}</div>
            ${out.html}</div>`;
    }
    function opt(v, l, cur) { return `<option value="${e(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${e(l)}</option>`; }
    function filtersHtml(R, d, s) {
        const cmb = (k, label, list, all) => combo({ k, label, list: list.map(x => Array.isArray(x) ? x : [x, x]), cur: s[k], all, cb: 'PR.set' });
        const sel = (k, label, list, all) => `<label class="pr-f"><span>${e(label)}</span><select onchange="PR.set(this, '${k}', this.value)">${all ? opt('', all, s[k]) : ''}${list.map(x => Array.isArray(x) ? opt(x[0], x[1], s[k]) : opt(x, x, s[k])).join('')}</select></label>`;
        const uniq = a => Array.from(new Set(a.filter(Boolean))).sort((x, y) => String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: 'base' }));
        const parts = [];
        R.f.forEach(f => {
            if (f === 'view') parts.push(sel('view', 'Show', [['time', 'Over time'], ['yoy', 'Year on year (each year on top of the last)']]));
            if (f === 'years' && (R.id === 'station' || s.view === 'yoy')) parts.push(sel('years', R.id === 'station' && s.view !== 'yoy' ? 'Over the last' : 'Years', [['1', 'This year'], ['2', '2 years'], ['3', '3 years'], ['5', '5 years'], ['all', 'All years']]));
            if (f === 'period' && R.f.includes('view') && s.view === 'yoy') return;
            if (f === 'period') {
                parts.push(sel('preset', 'Period', PRESETS));
                if (s.preset === 'custom') parts.push(`<label class="pr-f"><span>From</span><input type="date" value="${e(s.from)}" onchange="PR.set(this, 'from', this.value)"></label><label class="pr-f"><span>To</span><input type="date" value="${e(s.to)}" onchange="PR.set(this, 'to', this.value)"></label>`);
            }
            if (f === 'type') parts.push(sel('type', 'Station type', uniq(d.stations.map(x => x.type)), 'All types'));
            if (f === 'pest') { const st = R.id === 'station' ? d.stations.find(x => x.barcode === s.station) : null; if (!(st && isActivity(st))) parts.push(cmb('pest', 'Pest', uniq((st ? st.entries : d.entries).map(x => x.species)), 'All pests')); }
            if (f === 'map') parts.push(cmb('map', 'Floor plan', uniq(d.stations.map(x => x.map)), 'All floor plans'));
            if (f === 'prep') parts.push(cmb('prep', 'Preparation', uniq(d.entries.map(x => x.prep)), 'All preparations'));
            if (f === 'tech') parts.push(sel('tech', 'Technician', uniq(d.visits.map(x => x.tech).concat(d.entries.map(x => x.tech))), 'Everyone'));
            if (f === 'station') parts.push(cmb('station', 'Station', d.stations.map(x => [x.barcode, x.name + (x.type ? ' · ' + x.type : '')]), R.id === 'station' ? null : 'All stations'));
            if (f === 'batch') parts.push(`<label class="pr-f"><span>Batch number</span><input type="search" value="${e(s.batch)}" placeholder="Any" onchange="PR.set(this, 'batch', this.value.trim())"></label>`);
            if (f === 'gap') parts.push(sel('gap', 'Flag stations not scanned for', [['14', '2 weeks'], ['35', '5 weeks'], ['60', '2 months'], ['95', '3 months']]));
            if (f === 'months') parts.push(sel('month', 'Month', months(Date.now() - 365 * DAY, Date.now()).reverse().map(k => [k, monthLong(k)])));
        });
        return parts.join('');
    }
    // the records a report looks at
    function pick(d, s, extra) {
        const [a, b] = range(s);
        return d.entries.filter(x => x.at >= a && x.at <= b && (!s.type || x.type === s.type) && (!extra || extra(x)));
    }
    const color = (opts, type) => (opts.colorOf ? opts.colorOf(type) : null) || '#64748b';
    const dot = (opts, type) => `<span class="pr-dot" style="background:${color(opts, type)}"></span>`;

    // external toxic (bait) stations are read by their activity: None, Low, Medium, High
    const LEVELS = ['None', 'Low', 'Medium', 'High'];
    const isActivity = st => /external/i.test(st.type || '') && /toxic|bait/i.test(st.type || '');
    const level = a => Math.max(0, LEVELS.indexOf(a));
    const levelOf = list => list.length ? Math.max(...list.map(x => level(x.activity))) : null;   // the highest that month
    const ACT_CHART = { max: 3, ticks: [0, 1, 2, 3], yLbl: v => LEVELS[v] || v };
    const MONTHS12 = Array.from({ length: 12 }, (_, i) => i);
    const monShort = i => new Date(2000, i, 1).toLocaleDateString(LOC, { month: 'short' });
    // the years a report covers (newest last)
    function yearsOf(s, d, list) {
        const now = new Date().getFullYear(), first = list && list.length ? new Date(list[0].at).getFullYear() : now;
        const n = s.years === 'all' ? Math.max(1, now - first + 1) : Math.max(1, Number(s.years) || 2);
        return Array.from({ length: n }, (_, i) => now - n + 1 + i);
    }
    const yearColor = (i, n) => i === n - 1 ? '#ea580c' : ['#2563eb', '#16a34a', '#9333ea', '#0891b2', '#ca8a04', '#db2777', '#64748b', '#94a3b8'][(n - 2 - i) % 8];
    // one line per year, January to December (months not reached yet are left off)
    function yoySeries(years, valOf) {
        const now = new Date();
        return years.map((yr, i) => ({ name: String(yr), color: yearColor(i, years.length), thin: i < years.length - 1,
            vals: MONTHS12.map(m => yr === now.getFullYear() && m > now.getMonth() ? null : valOf(yr, m)) }));
    }
    const inYM = (x, yr, m) => { const t = new Date(x.at); return t.getFullYear() === yr && t.getMonth() === m; };

    const BUILD = {
        trend(d, s) {
            if (s.view === 'yoy') {
                const list = d.entries.filter(x => x.species && (!s.type || x.type === s.type) && (!s.pest || x.species === s.pest));
                const years = yearsOf(s, d, list);
                const series = yoySeries(years, (yr, m) => list.filter(x => inYM(x, yr, m)).reduce((n, x) => n + x.count, 0));
                const head = [{ t: 'Month' }].concat(years.map(yr => ({ t: String(yr), num: true })));
                return {
                    html: kpis(years.slice().reverse().slice(0, 3).map(yr => ({ v: list.filter(x => new Date(x.at).getFullYear() === yr).reduce((n, x) => n + x.count, 0), l: `${s.pest || 'captures'} in ${yr}${yr === new Date().getFullYear() ? ' so far' : ''}` })))
                        + `<div class="pr-chart"><div class="pr-cap">${e(s.pest || 'All pests')}: captures each month, one line per year</div>${lineChart(series, MONTHS12, { lbl: monShort, label: 'Captures per month, year on year' })}</div>`
                        + table(head, MONTHS12.map(m => ({ cells: [e(monShort(m))].concat(series.map(x => x.vals[m] == null ? '' : x.vals[m])) }))),
                    csv: [head.map(h => h.t)].concat(MONTHS12.map(m => [monShort(m)].concat(series.map(x => x.vals[m] == null ? '' : x.vals[m]))))
                };
            }
            const [a, b] = range(s), list = pick(d, s, x => x.species && (!s.pest || x.species === s.pest));
            const ks = months(a || (d.entries[0] ? d.entries[0].at : Date.now()), b);
            const tot = new Map(); list.forEach(x => tot.set(x.species, (tot.get(x.species) || 0) + x.count));
            const top = Array.from(tot.entries()).sort((p, q) => q[1] - p[1]);
            const named = top.slice(0, 6).map(p => p[0]), rest = top.slice(6).map(p => p[0]);
            const series = named.map((sp, i) => ({ name: sp, color: PALETTE[i], vals: ks.map(k => list.filter(x => x.species === sp && monthKey(x.at) === k).reduce((n, x) => n + x.count, 0)) }));
            if (rest.length) series.push({ name: `Other (${rest.length})`, color: PALETTE[8], vals: ks.map(k => list.filter(x => rest.includes(x.species) && monthKey(x.at) === k).reduce((n, x) => n + x.count, 0)) });
            const totals = ks.map(k => list.filter(x => monthKey(x.at) === k).reduce((n, x) => n + x.count, 0));
            const half = Math.floor(ks.length / 2), first = totals.slice(0, half).reduce((p, q) => p + q, 0), second = totals.slice(half).reduce((p, q) => p + q, 0);
            const dir = !first && !second ? 'No captures' : second > first * 1.15 ? 'Going up' : second < first * 0.85 ? 'Going down' : 'Steady';
            const head = [{ t: 'Month' }].concat(series.map(x => ({ t: x.name, num: true })), [{ t: 'Total', num: true }]);
            const rows = ks.map((k, i) => ({ cells: [e(monthLong(k))].concat(series.map(x => x.vals[i] || ''), [`<b>${totals[i]}</b>`]) })).reverse();
            return {
                html: kpis([{ v: list.reduce((n, x) => n + x.count, 0), l: 'captures' }, { v: tot.size, l: 'pests' }, { v: dir, l: 'trend (second half vs first)', c: dir === 'Going up' ? '#dc2626' : dir === 'Going down' ? '#16a34a' : '' }])
                    + `<div class="pr-chart">${series.length ? lineChart(series, ks, { lbl: monthLbl, label: 'Captures per month' }) : '<div class="pr-empty">No pests were caught in this period.</div>'}</div>` + table(head, rows),
                csv: [head.map(h => h.t)].concat(ks.map((k, i) => [monthLong(k)].concat(series.map(x => x.vals[i]), [totals[i]])))
            };
        },
        pests(d, s, opts) {
            const list = pick(d, s, x => x.species && (!s.station || x.barcode === s.station) && (!s.pest || x.species === s.pest));
            // each pest, and each station it was recorded on
            const tot = new Map(), by = new Map();
            list.forEach(x => {
                tot.set(x.species, (tot.get(x.species) || 0) + x.count);
                const k = x.species + '\u0000' + x.barcode, o = by.get(k) || { sp: x.species, st: x.stationObj, n: 0, times: 0, last: 0 };
                o.n += x.count; o.times++; o.last = Math.max(o.last, x.at); by.set(k, o);
            });
            const all = list.reduce((n, x) => n + x.count, 0);
            const pests = Array.from(tot.entries()).sort((p, q) => q[1] - p[1]);
            const rank = new Map(pests.map(([sp], i) => [sp, i]));
            const rows = Array.from(by.values()).sort((p, q) => rank.get(p.sp) - rank.get(q.sp) || q.n - p.n || p.st.name.localeCompare(q.st.name, undefined, { numeric: true }));
            const head = [{ t: 'Pest' }, { t: 'Station' }, { t: 'Station type' }, { t: 'Floor plan' }, { t: 'Captures', num: true }, { t: 'Times recorded', num: true }, { t: 'Last found' }];
            return {
                html: kpis([{ v: all, l: 'captures' }, { v: pests.length, l: 'different pests' }, { v: new Set(list.map(x => x.barcode)).size, l: 'stations with pests' }, { v: pests[0] ? pests[0][0] : '-', l: 'most common' }])
                    + `<div class="pr-chart">${barChart(pests.map(([sp, n], i) => ({ l: sp, v: n, c: PALETTE[i % 8] })))}</div>`
                    + table(head, rows.map(o => ({ cells: [e(o.sp), stLink(opts, o.st), e(o.st.type || ''), e(o.st.map || ''), o.n, o.times, e(fmtD(o.last))] })), { empty: 'No pests recorded for this choice.' }),
                csv: [head.map(h => h.t)].concat(rows.map(o => [o.sp, o.st.name, o.st.type || '', o.st.map || '', o.n, o.times, fmtD(o.last)]))
            };
        },
        stations(d, s, opts) {
            const list = pick(d, s, x => x.species && (!s.pest || x.species === s.pest));
            const by = new Map();
            list.forEach(x => { const o = by.get(x.barcode) || { st: x.stationObj, n: 0, recs: 0, last: 0, pests: new Map() }; o.n += x.count; o.recs++; o.last = Math.max(o.last, x.at); o.pests.set(x.species, (o.pests.get(x.species) || 0) + x.count); by.set(x.barcode, o); });
            const rows = Array.from(by.values()).sort((p, q) => q.n - p.n);
            const head = [{ t: 'Station' }, { t: 'Type' }, { t: 'Floor plan' }, { t: 'Captures', num: true }, { t: 'Times with pests', num: true }, { t: 'Main pest' }, { t: 'Last found' }];
            const main = o => Array.from(o.pests.entries()).sort((p, q) => q[1] - p[1])[0][0];
            return {
                html: kpis([{ v: rows.length, l: 'stations with pests' }, { v: list.reduce((n, x) => n + x.count, 0), l: 'captures' }, { v: rows[0] ? rows[0].st.name : '-', l: 'busiest station' }])
                    + `<div class="pr-chart">${barChart(rows.slice(0, 15).map(o => ({ l: o.st.name, v: o.n, c: color(opts, o.st.type) })))}${rows.length > 15 ? `<p class="pr-note">The top 15 are charted; all ${rows.length} are in the table.</p>` : ''}</div>`
                    + table(head, rows.map(o => ({ cells: [stLink(opts, o.st), e(o.st.type), e(o.st.map || '-'), o.n, o.recs, e(main(o)), e(fmtD(o.last))] }))),
                csv: [head.map(h => h.t)].concat(rows.map(o => [o.st.name, o.st.type, o.st.map, o.n, o.recs, main(o), fmtD(o.last)]))
            };
        },
        station(d, s, opts) {
            if (!s.station || !d.stations.some(x => x.barcode === s.station)) s.station = d.stations[0] ? d.stations[0].barcode : '';
            const stn = d.stations.find(x => x.barcode === s.station);
            if (!stn) return { html: '<div class="pr-empty">This site has no stations yet.</div>', csv: [] };
            const act = isActivity(stn);
            if (act || (s.pest && !stn.entries.some(x => x.species === s.pest))) s.pest = '';
            const years = yearsOf(s, d, stn.entries), from = new Date(years[0], 0, 1).getTime();
            const list = stn.entries.filter(x => x.at >= from);
            const caught = list.filter(x => x.species && (!s.pest || x.species === s.pest));
            let chart, cap;
            if (s.view === 'yoy') {
                const series = yoySeries(years, (yr, m) => { const inM = list.filter(x => inYM(x, yr, m)); return act ? levelOf(inM) : (inM.length ? caught.filter(x => inYM(x, yr, m)).reduce((n, x) => n + x.count, 0) : null); });
                cap = act ? 'Activity each month (the highest found), one line per year' : `${s.pest || 'All pests'}: caught each month, one line per year`;
                chart = lineChart(series, MONTHS12, Object.assign({ lbl: monShort, label: cap }, act ? ACT_CHART : {}));
            } else {
                const ks = months(from, Date.now());
                if (act) {
                    cap = 'Activity each month (the highest found; no point = not checked that month)';
                    chart = lineChart([{ name: 'Activity', color: color(opts, stn.type), vals: ks.map(k => levelOf(list.filter(x => monthKey(x.at) === k))) }], ks, Object.assign({ lbl: monthLbl, label: cap }, ACT_CHART));
                } else {
                    const tot = new Map(); caught.forEach(x => tot.set(x.species, (tot.get(x.species) || 0) + x.count));
                    const sp = Array.from(tot.entries()).sort((p, q) => q[1] - p[1]).map(p => p[0]);
                    const checked = k => list.some(x => monthKey(x.at) === k);
                    const series = sp.slice(0, 8).map((name, i) => ({ name, color: PALETTE[i], vals: ks.map(k => checked(k) ? caught.filter(x => x.species === name && monthKey(x.at) === k).reduce((n, x) => n + x.count, 0) : null) }));
                    if (sp.length > 8) series.push({ name: `Other (${sp.length - 8})`, color: PALETTE[8], vals: ks.map(k => checked(k) ? caught.filter(x => sp.slice(8).includes(x.species) && monthKey(x.at) === k).reduce((n, x) => n + x.count, 0) : null) });
                    cap = 'Caught each month, one line per pest (no point = not checked that month)';
                    chart = series.length ? lineChart(series, ks, { lbl: monthLbl, label: cap }) : '<div class="pr-empty">Nothing was caught at this station in this time.</div>';
                }
            }
            const head = [{ t: 'Date' }, { t: 'Activity' }, { t: 'Pest' }, { t: 'Number', num: true }, { t: 'Preparation' }, { t: 'Batch' }, { t: 'Technician' }, { t: 'Notes' }];
            const rows = list.slice().reverse();
            const mapBtn = stn.map && opts.onMap ? `<button type="button" class="pr-btn pr-map-btn" data-b="${e(stn.barcode)}" onclick="PR.mapGo(this, this.dataset.b)">📍 Show on floor plan</button>` : '';
            return {
                html: `<div class="pr-station"><span>${dot(opts, stn.type)}<b>${e(stn.name)}</b> <span>${e(stn.type)}${stn.map ? ' · 📍 ' + e(stn.map) : ''} · ${e(stn.barcode)}</span></span>${mapBtn}</div>`
                    + kpis([{ v: list.length, l: 'checks' }, act ? { v: list.length ? LEVELS[levelOf(list)] : '-', l: 'highest activity' } : { v: caught.reduce((n, x) => n + x.count, 0), l: s.pest ? s.pest + ' caught' : 'caught' }, { v: stn.lastAt ? fmtDTS(stn.lastAt) : 'Never', l: 'last scanned' }])
                    + `<div class="pr-chart"><div class="pr-cap">${e(cap)}</div>${chart}</div>`
                    + table(head, rows.map(x => ({ cells: [e(fmtDT(x.at)), e(x.activity), e(x.species || '-'), x.count || '', prepLink(opts, x.prep || '') + (x.qty != null ? ` <span class="pr-faint">${e(x.qty)} ${e(x.unit)}</span>` : ''), `<span class="pr-mono">${e(x.batch)}</span>`, e(x.tech), e(x.notes)] }))),
                csv: [head.map(h => h.t)].concat(rows.map(x => [fmtDT(x.at), x.activity, x.species, x.count || '', x.prep, x.batch, x.tech, x.notes]))
            };
        },
        scanned(d, s, opts) {
            const gap = Number(s.gap) || 35, now = Date.now();
            const list = d.stations.filter(x => (!s.type || x.type === s.type) && (!s.map || x.map === s.map))
                .map(x => Object.assign({ days: x.lastAt ? Math.floor((now - x.lastAt) / DAY) : null }, { x })).sort((p, q) => (q.days == null ? 1e9 : q.days) - (p.days == null ? 1e9 : p.days));
            const late = list.filter(o => o.days == null || o.days > gap);
            const head = [{ t: 'Station' }, { t: 'Type' }, { t: 'Floor plan' }, { t: 'Last scanned' }, { t: 'Days ago', num: true }, { t: 'Last result' }, { t: 'By' }];
            return {
                html: kpis([{ v: list.length, l: 'stations' }, { v: list.length - late.length, l: `scanned in the last ${gap} days`, c: '#16a34a' }, { v: late.length, l: 'not scanned for longer', c: late.length ? '#dc2626' : '' }])
                    + table(head, list.map(o => ({ _cls: o.days == null || o.days > gap ? 'pr-late' : '', cells: [stLink(opts, o.x), e(o.x.type), e(o.x.map || '-'), e(o.x.lastAt ? fmtDTS(o.x.lastAt) : 'Never'), o.days == null ? '-' : o.days, e(o.x.last ? (o.x.last.species ? `${o.x.last.species}${o.x.last.count ? ' ×' + o.x.last.count : ''}` : o.x.last.activity === 'None' ? 'No activity' : o.x.last.activity) : '-'), e(o.x.last ? o.x.last.tech : '')] }))),
                csv: [head.map(h => h.t)].concat(list.map(o => [o.x.name, o.x.type, o.x.map, o.x.lastAt ? fmtDTS(o.x.lastAt) : 'Never', o.days == null ? '' : o.days, o.x.last ? (o.x.last.species || o.x.last.activity) : '', o.x.last ? o.x.last.tech : '']))
            };
        },

        async function refreshAdmin() {
            if (!isOnline) { setAdminTab(adminTab); return; }
            const since = new Date(Date.now() - 30 * 86400000).toISOString();
            const grab = async (key, q) => { try { const r = await q; if (r.error) throw r.error; adminData.errors[key] = ''; return r.data || []; } catch (e) { adminData.errors[key] = portalMissing(e) && key === 'docs' ? PORTAL_SQL_NOTE : (e.message || String(e)); return []; } };
            const [recs, docs, events, profs, allowed, cus, cas] = await Promise.all([
                grab('recs', _supabase.from('recommendations').select('id, rec_no, client_id, station_name, station_barcode, text, status, raised_at, raised_by').neq('status', 'complete')),
                grab('docs', _supabase.from('site_documents').select('*')),
                grab('events', _supabase.from('site_events').select('*').gte('at', since).order('at', { ascending: false }).limit(500)),
                grab('profiles', _supabase.from('profiles').select('*')),
                grab('allowed', _supabase.from('allowed_emails').select('*')),
                grab('clientUsers', _supabase.from('client_users').select('*')),
                grab('clientAccess', _supabase.from('client_access').select('*'))
            ]);
            Object.assign(adminData, { recs, docs, events, loadedAt: Date.now() });
            adminProfiles = profs;
            adminAllowed = allowed; adminClients = cus; adminClientAccess = cas; clientAdminReady = !adminData.errors.clientUsers;

        // change a document's expiry date, move it to a folder, or remove it
        async function adminDocUpdate(d, fields, title) {
            const { error } = await _supabase.from('site_documents').update(fields).eq('id', d.id);
            if (error) { alert('Could not save: ' + error.message); return false; }
            Object.assign(d, fields);
            await queueSiteChange({ client_id: d.client_id, action: 'document', title, detail: d.category });
            renderAdminDocs();
            return true;
        }
        async function adminDocExpiry(id) {
            const d = adminData.docs.find(x => x.id === id);
            if (!d) return;
            const v = prompt(`Expiry date for "${d.title}" (YYYY-MM-DD). Leave empty if it doesn't expire.`, d.expires_on || '');
            if (v === null) return;
            const val = v.trim();
            if (val && !/^\d{4}-\d{2}-\d{2}$/.test(val)) { alert('Enter the date as YYYY-MM-DD, e.g. 2027-03-31.'); return; }
            await adminDocUpdate(d, { expires_on: val || null }, `Document "${d.title}" expiry ${val ? 'set to ' + fmtDay(val) : 'removed'}`);
        }
        async function adminDocMove(id) {
            const d = adminData.docs.find(x => x.id === id);
            if (!d) return;
            const { data } = await _supabase.from('site_document_folders').select('name').eq('client_id', String(d.client_id));
            const names = folderNames(data || [], adminData.docs.filter(x => String(x.client_id) === String(d.client_id)));
            const v = prompt(`Move "${d.title}" to which folder?\n\n${names.join('\n')}\n\n(type a folder name, or leave empty for no folder)`, docFolderOf(d) || '');
            if (v === null) return;
            const name = v.trim().replace(/\s+/g, ' ');
            if (name && !names.some(n => n.toLowerCase() === name.toLowerCase())) {
                if (!confirm(`There's no folder called "${name}" on this site. Make it?`)) return;
                const { error } = await _supabase.from('site_document_folders').insert({ id: uid(), client_id: String(d.client_id), name, created_by: technicianLabel() });
                if (error) { alert('Could not make the folder: ' + error.message); return; }
            }
            const real = names.find(n => n.toLowerCase() === name.toLowerCase()) || name;
            await adminDocUpdate(d, { folder: real || null }, real ? `Document "${d.title}" moved to ${real}` : `Document "${d.title}" taken out of its folder`);
        }
        async function adminDocRemove(id) {
            const d = adminData.docs.find(x => x.id === id);
            if (!d || !confirm(`Remove "${d.title}"? The client will no longer see it.`)) return;
            const { error } = await _supabase.from('site_documents').delete().eq('id', id);
            if (error) { alert('Could not remove: ' + error.message); return; }
            await _supabase.storage.from(DOC_BUCKET).remove([d.file_path]).catch(() => {});
            adminData.docs = adminData.docs.filter(x => x.id !== id);
            await queueSiteChange({ client_id: d.client_id, action: 'document', title: `Document "${d.title}" removed`, detail: d.category });
            renderAdminDocs();
        }

        async function adminFetchAll(table, cid, cols) {
            let out = [];
            for (let from = 0; from < 200000; from += 1000) {
                const { data, error } = await _supabase.from(table).select(cols || '*').eq('client_id', String(cid)).range(from, from + 999);
                if (error) throw error;
                out = out.concat(data || []);
                if (!data || data.length < 1000) break;
            }
            return out;
        }

        // ---------- Site contacts (each site's people and their roles) ----------
        const CT_ROLES = ['Site manager', 'Facilities manager', 'Health & safety', 'Quality / food safety', 'Operations', 'Maintenance', 'Reception', 'Accounts', 'After hours'];
        let adminCt = { cid: '', list: [], editing: null, error: '' };
        async function loadAdminContacts() {
            const cid = document.getElementById('ctSite').value;

                list.forEach(x => { x._main = x === main; });

        function renderAdminContacts() {

        // ---------- Critical limits (each site's own) ----------

        async function saveAdminLimit() {
            const cid = adminLim.cid, id = adminLim.editing && adminLim.editing !== 'new' ? adminLim.editing : null;
            const name = document.getElementById('limName').value.trim().replace(/\s+/g, ' ');
            if (!name) { alert('Give the critical limit a name.'); document.getElementById('limName').focus(); return; }
            if (adminLim.list.some(l => String(l.id) !== String(id) && String(l.name).toLowerCase() === name.toLowerCase())) { alert(`This site already has a critical limit called "${name}".`); return; }
            const rules = [], seen = new Set();
            for (const row of document.querySelectorAll('#limRules .lim-rule')) {
                const sp = row.querySelector('.lim-sp').value.trim(), mx = row.querySelector('.lim-max').value.trim();
                if (!sp && !mx) continue;
                if (!sp) { alert('Each limit needs the pest name.'); return; }
                if (mx === '' || !(Number(mx) >= 0) || !Number.isInteger(Number(mx))) { alert(`Enter the most captures a month for ${sp} (a whole number).`); return; }
                if (seen.has(sp.toLowerCase())) { alert(`${sp} is listed twice.`); return; }
                seen.add(sp.toLowerCase()); rules.push({ species: sp, max: Number(mx) });
            }
            if (!rules.length) { alert('Add at least one pest with its monthly limit.'); return; }
            const btn = document.getElementById('limSaveBtn'); btn.disabled = true; btn.textContent = 'Saving...';
            try {
                const now = new Date().toISOString(), lid = id || uid();
                const row = Object.assign({ id: lid, client_id: String(cid), name, rules, updated_by: technicianLabel(), updated_at: now }, id ? {} : { created_by: technicianLabel(), created_at: now });
                const { error } = await _supabase.from('site_limits').upsert([row], { onConflict: 'id' });
                if (error) throw error;
                // the stations ticked are on this limit; the ones unticked come off it
                const ticked = new Set(Array.from(document.querySelectorAll('#limEditor .lim-st:checked')).map(x => x.value));
                const changes = adminLim.stations.filter(st => document.querySelector(`#limEditor .lim-st[value="${CSS.escape(String(st.id))}"]`))
                    .filter(st => ticked.has(String(st.id)) !== (String(st.limit_id) === lid));
                for (const st of changes) {
                    const v = ticked.has(String(st.id)) ? lid : null;
                    const { error: e2 } = await _supabase.from('stations').update({ limit_id: v, updated_at: now }).eq('id', st.id);
                    if (e2) throw e2;
                }
                await queueSiteChange({ client_id: cid, action: 'limit', title: `Critical limit ${id ? 'changed' : 'added'}: ${name}`, detail: rules.map(r => `${r.species} ${r.max}/month`).join(', ') });

            } catch (e) {
                alert('Could not save the critical limit: ' + (/site_limits|limit_id|does not exist|schema cache/i.test(e.message || '') ? 'run pestis_client_portal.sql on the Pestis server (it updates the database itself when it restarts) first.' : (e.message || e)));
                btn.disabled = false; btn.textContent = 'Save';

        }
        async function deleteAdminLimit(id) {
            const l = adminLim.list.find(x => String(x.id) === String(id));

        // ---------- Reports (the same reports as the Client Portal) ----------

        // ---------- Download a whole folder of a site as one zip ----------
        let jszipLoading = null;
        function loadJSZip() {
            if (window.JSZip) return Promise.resolve(window.JSZip);
            return jszipLoading = jszipLoading || new Promise((res, rej) => {
                const sc = document.createElement('script');
                sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                sc.onload = () => window.JSZip ? res(window.JSZip) : rej(new Error('the zip tool did not load'));
                sc.onerror = () => { jszipLoading = null; rej(new Error('the zip tool could not be loaded')); };
                document.head.appendChild(sc);
            });
        }
        let adminDlMaps = [];
        function adminDlFillSites() {
            const sel = document.getElementById('adminDlSite');
            if (!sel) return;
            const keep = sel.value;
            sel.innerHTML = '<option value="">Choose a site...</option>' + clientsData.slice().sort((a, b) => String(a.Name || '').localeCompare(String(b.Name || ''), undefined, { sensitivity: 'base' })).map(c => `<option value="${esc(String(c.id))}">${esc(c.Name || 'Unnamed site')}</option>`).join('');

        async function adminDlSiteChanged() {
            const cid = document.getElementById('adminDlSite').value, fs = document.getElementById('adminDlFolder'), btn = document.getElementById('adminDlBtn');
            fs.disabled = btn.disabled = !cid;
            fs.innerHTML = '<option value="">Choose a folder...</option>';
            adminDlMaps = [];
            if (!cid) return;
            const docs = adminData.docs.filter(d => String(d.client_id) === String(cid));
            const [{ data: rows }, { data: maps }] = await Promise.all([
                _supabase.from('site_document_folders').select('name').eq('client_id', String(cid)),
                _supabase.from('site_maps').select('*').eq('client_id', String(cid))]);
            adminDlMaps = (maps || []).filter(m => m.image_path && !m.deleted);
            const names = folderNames(rows || [], docs);
            fs.innerHTML = '<option value="">Choose a folder...</option>' + names.map(f => {
                const n = docs.filter(d => docFolderOf(d) === f).length + (/^maps?$/i.test(f) ? adminDlMaps.length : 0);
                return `<option value="${esc(f)}" ${n ? '' : 'disabled'}>${esc(f)} (${n} file${n === 1 ? '' : 's'})</option>`;
            }).join('');
        }
        async function adminDownloadFolder() {
            const cid = document.getElementById('adminDlSite').value, folder = document.getElementById('adminDlFolder').value, btn = document.getElementById('adminDlBtn');
            if (!cid || !folder) { alert('Choose a site and a folder first.'); return; }
            const extOf = p => ((String(p || '').match(/\.([a-z0-9]{2,5})(?:\?|$)/i) || [])[1] || 'pdf').toLowerCase();
            const files = adminData.docs.filter(d => String(d.client_id) === String(cid) && docFolderOf(d) === folder && d.file_path).map(d => ({ name: `${d.title || 'Document'}.${extOf(d.file_path)}`, bucket: DOC_BUCKET, path: d.file_path }));
            if (/^maps?$/i.test(folder)) adminDlMaps.forEach(m => files.push({ name: `Floor plan - ${m.name}.${extOf(m.image_path)}`, bucket: PHOTO_BUCKET, path: m.image_path }));
            if (!files.length) { alert('There is nothing in this folder to download yet.'); return; }
            const label = btn.textContent, say = t => { btn.textContent = t; };
            btn.disabled = true;
            try {
                say('Preparing...');
                const JSZip = await loadJSZip();
                const zip = new JSZip(), used = new Set();
                let n = 0, failed = 0;
                for (const f of files) {
                    say(`${++n} of ${files.length}...`);
                    try {
                        const { data, error } = await _supabase.storage.from(f.bucket).createSignedUrl(f.path, 600);
                        if (error || !data) throw error || new Error('not found');
                        const r = await fetch(data.signedUrl);
                        if (!r.ok) throw new Error('HTTP ' + r.status);
                        const base = f.name.replace(/[\\/:*?"<>|]+/g, '-').trim();
                        let name = base, k = 2;
                        while (used.has(name.toLowerCase())) name = base.replace(/(\.[^.]+)$/, ` (${k++})$1`);
                        used.add(name.toLowerCase());
                        zip.file(name, await r.blob());
                    } catch (e) { failed++; }
                }
                if (failed === files.length) throw new Error('none of the files could be downloaded');
                say('Zipping...');
                const blob = await zip.generateAsync({ type: 'blob' });
                const site = siteById(cid), a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${(site && site.Name) || 'Site'} - ${folder}.zip`.replace(/[\\/:*?"<>|]+/g, '-');
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 60000);
                if (failed) alert(`${failed} of ${files.length} files couldn't be downloaded and are missing from the zip.`);
            } catch (e) { alert('Could not download the folder: ' + (e.message || e)); }
            finally { btn.disabled = false; btn.textContent = label; }
        }
        async function adminOpenDoc(id) {
            const d = adminData.docs.find(x => x.id === id);
            if (!d) return;
            const w = window.open('', '_blank');
            const { data, error } = await _supabase.storage.from(DOC_BUCKET).createSignedUrl(d.file_path, 600);

        // ---------- Excel (.xlsx) downloads: a small built-in writer, no extra library ----------
        const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

            document.getElementById('pestEditSub').value = o.subcategory || pestSubOf(o) || '';
            document.getElementById('pestSubList').innerHTML = PEST_SUB_ORDER.map(x => `<option value="${esc(x)}">`).join('');
            pestEditGal = (() => { let g = o.gallery; if (typeof g === 'string') { try { g = JSON.parse(g); } catch (e) { g = null; } } return g ? { pest: (g.pest || []).slice(), signs: (g.signs || []).slice() } : { pest: [], signs: [] }; })();
            drawPestEditGallery();
            document.getElementById('pestEditPhoto').value = '';
            const pic = document.getElementById('pestEditPic');
            pic.innerHTML = o.photo_path ? '<span class="t-faint text-xs">Loading picture...</span>' : '<span class="t-faint text-xs">No picture yet</span>';
            document.getElementById('pestEditPicRemove').classList.toggle('hidden', !o.photo_path);
            document.getElementById('pestEditModal').classList.remove('hidden');
            if (o.photo_path && (isOnline || isWebPic(o.photo_path))) {
                const u = (await getSignedUrls([o.photo_path])).get(o.photo_path);
                if (pestEditId === o.id && !pestEditFile) pic.innerHTML = u ? `<img src="${u}" alt="">` : '<span class="t-faint text-xs">Picture unavailable</span>';
            }
        }
        let pestEditGal = { pest: [], signs: [] };
        function drawPestEditGallery() {
            const row = (k, title) => `<div><div class="text-[10px] font-bold t-faint mb-1">${title} (${pestEditGal[k].length})</div><div class="flex flex-wrap gap-1.5">${pestEditGal[k].map((x, i) => `<span class="relative inline-block w-20 h-14 rounded-lg overflow-hidden border divider"><img src="${esc(typeof wmPic === 'function' ? wmPic(x.u, 250) : x.u)}" alt="" class="w-full h-full object-cover" onerror="typeof wmFallback === 'function' && wmFallback(this, '·')"><button type="button" class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full text-[11px] font-black text-white" style="background:rgba(220,38,38,.9);" onclick="pestEditGal.${k}.splice(${i}, 1); drawPestEditGallery()" title="Remove this photo" aria-label="Remove this photo">✕</button></span>`).join('') || '<span class="t-faint italic">None</span>'}</div></div>`;
            document.getElementById('pestEditGallery').innerHTML = row('pest', 'The pest') + row('signs', 'Signs of infestation');
        }
        async function pestEditRefind() {
            const o = findPest(pestEditId);
            if (!o) return;
            if (!isOnline) { alert('Finding photos needs a connection.'); return; }
            document.getElementById('pestEditGallery').innerHTML = '<span class="t-faint italic">Finding photos...</span>';
            try { const g = await findPestGallery(o); pestEditGal = { pest: g.pest, signs: g.signs }; } catch (e) {}
            drawPestEditGallery();
        }
        function closePestEdit() { document.getElementById('pestEditModal').classList.add('hidden'); pestEditId = null; pestEditFile = null; }
        function pestEditPreview(input) {
            const f = input.files && input.files[0];
            if (!f) return;
            pestEditFile = f; pestEditDropPic = false;
            document.getElementById('pestEditPic').innerHTML = `<img src="${URL.createObjectURL(f)}" alt="">`;
            document.getElementById('pestEditPicRemove').classList.remove('hidden');
        }
        function pestEditRemovePic() {
            pestEditFile = null; pestEditDropPic = true;
            document.getElementById('pestEditPhoto').value = '';
            document.getElementById('pestEditPic').innerHTML = '<span class="t-faint text-xs">No picture</span>';
            document.getElementById('pestEditPicRemove').classList.add('hidden');
        }
        async function savePestEdit() {
            const o = findPest(pestEditId);
            if (!o) { closePestEdit(); return; }
            const cat = pestCatValue('pestEditCat', 'pestEditCatNew');
            if (!cat) { alert('Enter the new category name.'); return; }
            const upd = {
                category: cat,
                about: document.getElementById('pestEditAbout').value.trim(),
                breeding: document.getElementById('pestEditBreeding').value.trim(),
                control: document.getElementById('pestEditControl').value.trim(),
                subcategory: document.getElementById('pestEditSub').value.trim() || null,
                gallery: { pest: pestEditGal.pest, signs: pestEditGal.signs, at: new Date().toISOString() },
                updated_at: new Date().toISOString(), updated_by: technicianLabel()
            };
            const btn = document.getElementById('pestEditSave');
            const old = o.photo_path;
            if (pestEditFile) {
                if (!isOnline) { alert('Uploading a picture needs a connection. Remove the new picture to save the text now.'); return; }
                btn.disabled = true; btn.textContent = 'Uploading picture...';
                try {
                    const blob = await compressImage(pestEditFile, 1600, 0.82, 'avatar');
                    const path = `library/pests/${o.id}-${Date.now()}.jpg`;
                    const { error } = await withTimeout(_supabase.storage.from(PHOTO_BUCKET).upload(path, blob, { upsert: true, contentType: blob.type || 'image/jpeg' }), 120000, 'Picture upload');
                    if (error) throw error;
                    upd.photo_path = path; upd.photo_source = null;
                } catch (e) { alert('The picture could not be uploaded: ' + ((e && e.message) || e)); return; }
                finally { btn.disabled = false; btn.textContent = 'Save'; }
            } else if (pestEditDropPic) { upd.photo_path = null; upd.photo_source = null; }
            if (old && !isWebPic(old) && upd.photo_path !== undefined && upd.photo_path !== old) _supabase.storage.from(PHOTO_BUCKET).remove([old]).catch(() => {});
            Object.assign(o, upd);
            await cacheSet('app_options', appOptions);
            await enqueue({ kind: 'add_option', siteName: 'Settings', label: `Pest guide for "${o.label}" updated`, data: Object.assign({ id: o.id, kind: 'species', label: o.label, sort: o.sort || 0 }, upd) });
            closePestEdit();
            populateOptionSelects();
            renderSettingsLists();
        }

        async function removeOption(id) {
            if (!isAdmin()) { alert('Only admins can remove items from this list.'); return; }
            const o = appOptions.find(x => x.id === id);
            if (!o) return;
            if (!confirm(`Remove "${o.label}" from the list? Records that already use it are not changed.`)) return;
            appOptions = appOptions.filter(x => x.id !== id);
            await cacheSet('app_options', appOptions);

            // If it was only added on this device and hasn't uploaded, just cancel that
            const unsentAdd = queueItems.find(i => i.status !== 'sent' && i.status !== 'uploading' && i.kind === 'add_option' && i.data.id === id);
            if (unsentAdd) await removeQueueItem(unsentAdd);
            else if (!String(id).startsWith('default-')) {
                await enqueue({ kind: 'delete_option', siteName: 'Settings', label: `Removed ${OPTION_KIND_LABEL[o.kind] || o.kind} "${o.label}"`, data: { id: id, kind: o.kind } });
            }
            updateSyncBadge();
            populateOptionSelects();
            renderSettingsLists();
        }

        // ---------- this file's own page check ----------
        (function () {
            const need = ["adminPage", "adminTabs", "adminTiles", "adminAttention", "adminWorkload", "adminDocsList", "adminDocSite", "adminActivityList", "adminExports", "adminSitesNoClient", "staffProfileModal", "userFilterChips", "adminServicesList", "adminSvcSearch", "adminDocFolder", "adminClientsList", "clientNewSites", "optionsAdminNote", "dayLogCal", "adminActWho", "spSettings", "newPrepSds", "newPrepSdsExpiry", "newSpeciesCat", "sdsEditModal", "pestEditModal", "newPrepUnit", "adminPanel", "adminNewEmail", "adminNewRole", "adminProfilesList", "adminAllowedList"];
            const missing = need.filter(id => !document.getElementById(id));
            if (missing.length) console.error('admin.html is incomplete. Missing:', missing);
            document.querySelectorAll('.addon-version').forEach(el => { el.textContent = window.ADDON_INFO.version; });
        })();
</script>
</body>
